name: Build and push container images

on:
  workflow_call:
    inputs:
      image:
        description: 'Image name (see magicrew.yml)'
        required: true
        type: string
      githubToken:
        description: 'GitHub token'
        required: true
        type: string

env:
  CONTAINER_PLATFORMS: linux/amd64,linux/arm64
  DEFAULT_BUILD_ARGS: |
    {
      "TZ": "UTC",
      "GOPROXY": "",
      "APK_MIRROR": "dl-cdn.alpinelinux.org",
      "APT_MIRROR": "deb.debian.org",
      "PIP_INDEX_URL": "https://pypi.org/simple",
      "COMPOSER_MIRROR": ""
    }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare
        id: prepare
        shell: python3 -u ./.github/workflows/prepare_image_build.py {0}
        run: |
          {
            "vars": ${{ toJson(vars) }},
            "secrets": ${{ toJson(secrets) }},
            "github": ${{ toJson(github) }},
          }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: contains(steps.prepare.outputs.imageFullTags, 'ghcr.io')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ inputs.githubToken }}
      
      - name: Login to ECR
        if: contains(steps.prepare.outputs.imageFullTags, 'ecr.aws')
        uses: docker/login-action@v3
        with:
          registry: <aws-account-number>.dkr.ecr.<region>.amazonaws.com
          username: ${{ secrets.AWS_ACCESS_KEY_ID }}
          password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ steps.prepare.outputs.platforms }}
          context: ${{ steps.prepare.outputs.context }}
          pull: true
          push: true
          provenance: mode=max
          build-args: ${{ steps.prepare.outputs.args }}
          tags: ${{ steps.prepare.outputs.tags }}
